modules:
  - type: dnf
    install:
      packages:
        - niri
        - xwayland-satellite
        - noctalia
        - alacritty

  - type: dnf
    repos:
      copr:
        - errornointernet/walker
    install:
      packages:
        - walker
        - elephant

  - type: dnf
    install:
      packages:
        - swappy
        - grim
        - slurp
        - netcat

  - type: dnf
    install:
      packages:
        - mullvad-browser
        - brave-browser

  - type: dnf
    repos:
      cleanup: true # clean up added repos after module is done
      files:
        - https://repo.librewolf.net/librewolf.repo
    install:
      packages:
        - librewolf